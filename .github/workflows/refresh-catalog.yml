name: refresh-catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: write

concurrency:
  group: chatterbox-bundle-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out Chatterbox-enabled OnnxVoice source
        uses: actions/checkout@v4
        with:
          repository: buchwandler/onnxvoice
          ref: v0.2.11
          path: _ci/onnxvoice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OnnxVoice catalog tooling
        run: python -m pip install --editable _ci/onnxvoice
      - name: Assert OnnxVoice release version
        run: python -c "import onnxvoice; assert onnxvoice.__version__ == '0.2.11', onnxvoice.__version__; print(onnxvoice.__version__)"
      - name: Check committed catalog integrity
        run: python scripts/check_catalog_integrity.py
      - name: Build the pinned catalog
        run: >-
          onnxvoice catalog chatterbox build
          --seed catalog/seed.json
          --output catalog/bundles.json
          --source-output catalog/source.json
      - name: Verify generated catalogs
        run: |
          python scripts/check_catalog_integrity.py
          onnxvoice catalog chatterbox verify --catalog catalog/bundles.json --source catalog/source.json
      - name: Assert deterministic rebuild
        run: |
          cp catalog/bundles.json /tmp/chatterbox-bundles-first.json
          cp catalog/source.json /tmp/chatterbox-source-first.json
          onnxvoice catalog chatterbox build --seed catalog/seed.json --output catalog/bundles.json --source-output catalog/source.json
          cmp --silent /tmp/chatterbox-bundles-first.json catalog/bundles.json
          cmp --silent /tmp/chatterbox-source-first.json catalog/source.json
          python scripts/check_catalog_integrity.py
          onnxvoice catalog chatterbox verify --catalog catalog/bundles.json --source catalog/source.json
      - name: Commit and publish verified catalog changes
        run: |
          catalog_paths="catalog/bundles.json catalog/source.json"
          if [ -z "$(git status --porcelain -- $catalog_paths)" ]; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $catalog_paths
          git commit -m "chore: refresh Chatterbox bundle catalog"
          git pull --rebase origin main
          onnxvoice catalog chatterbox build --seed catalog/seed.json --output catalog/bundles.json --source-output catalog/source.json
          python scripts/check_catalog_integrity.py
          onnxvoice catalog chatterbox verify --catalog catalog/bundles.json --source catalog/source.json
          if [ -n "$(git status --porcelain -- $catalog_paths)" ]; then
            git add $catalog_paths
            git commit -m "chore: reconcile Chatterbox catalog after rebase"
          fi
          git push origin HEAD:main
